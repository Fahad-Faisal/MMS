spring:
  application:
    name: mms-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres}
    username: ${DATABASE_USERNAME:postgres.wwxyshxrerouvdnvfwqr}
    password: ${DATABASE_PASSWORD:posgres123@}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: ${SHOW_SQL:true}

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:2023200000136@seu.edu.bd}
    password: ${MAIL_PASSWORD:xwsm xsma xmji ftqb}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
    cache-names:
      - students
      - student
      - classrooms
      - dashboard
      - defaulters
      - users
      - ledger
      - balance
      - attendance
      - receipts

  # FIX: Multipart configuration should be here, under spring
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB
      resolve-lazily: false

